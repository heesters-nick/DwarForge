name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        id: extract_notes
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "# Release ${{ steps.get_version.outputs.version }}" > release_notes.md
            echo "" >> release_notes.md
            echo "See commits for changes." >> release_notes.md
          else
            VERSION="${{ steps.get_version.outputs.version }}"
            awk "/## \[${VERSION#v}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md

            if [ ! -s release_notes.md ]; then
              echo "# Release ${{ steps.get_version.outputs.version }}" > release_notes.md
              echo "" >> release_notes.md
              echo "See CHANGELOG.md for details." >> release_notes.md
            fi
          fi

          echo "Release notes created"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: DwarForge ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
